name: FlexUPI Cloud CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Spin up PostgreSQL and Redis sidecars in the GitHub cloud environment
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: flexupi_db
          POSTGRES_USER: flexupi_user
          POSTGRES_PASSWORD: flexupi_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Build and Test with Maven
        run: ./mvnw clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/flexupi_db
          SPRING_DATASOURCE_USERNAME: flexupi_user
          SPRING_DATASOURCE_PASSWORD: flexupi_password
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379